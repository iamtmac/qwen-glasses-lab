[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-glasses-lab"
version = "0.2.0"
description = "Open-source local read-only BLE L2CAP + LAN STA WebDAV & ADB sync kit for Qwen AI Glasses G1 (macOS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "cryptography>=41.0.0",
    "httpx>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]
